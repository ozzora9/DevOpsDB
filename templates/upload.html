{% extends "base.html" %} {% block title %}사진 업로드 - ColorWalk{%
endblock %} {% block body_class %}upload-page{% endblock %} {% block
main_class %}upload-container{% endblock %} {% block content %}

<form id="upload-form" method="POST" enctype="multipart/form-data">
  <input type="hidden" name="gps_lat" id="gps_lat" />
  <input type="hidden" name="gps_lon" id="gps_lon" />

  <input
    type="hidden"
    name="color_id"
    id="color_id"
    value="{{ color_id if color_id else '' }}"
  />

  <!-- 🎨 선택된 색상 표시 -->
  <section class="color-select-box">
    <h3>🎨 선택한 색상</h3>

    <div class="ai-color-card" id="color-display">
      <div class="ai-color-left">
        <div class="ai-color-sample" id="color-sample"></div>
        <div class="ai-color-info">
          <h4 id="color-name">색상이 선택되지 않았어요</h4>
          <small id="color-hex">#------</small>
        </div>
      </div>
      <button type="button" class="btn primary select-btn">
        선택됨
      </button>
    </div>
  </section>

  <button type="button" id="gps-btn">📍 위치 확인</button>
  <!-- 📸 사진 업로드 -->
  <section class="upload-box">
    <h3>📷 사진 업로드</h3>

    <!-- label로 감싸서 클릭 = 파일 선택 -->
    <label for="file-input" class="upload-area">
      <div class="camera-box">
        <div class="camera-placeholder">
          <p>
            클릭하여 사진을 선택하세요<br />
            <small>모바일에서는 카메라가 열립니다</small>
          </p>
        </div>
        <div class="shutter-btn">
          <i class="fas fa-upload"></i>
        </div>
      </div>
    </label>

    <!-- 실제 파일 input (핵심) -->
    <input
      type="file"
      id="file-input"
      name="image"
      accept="image/*"
      capture="environment"
      hidden
      required
    />

    <!-- 📷 미리보기 -->
    <img
      id="preview"
      style="
        display: none;
        max-width: 100%;
        margin-top: 12px;
        border-radius: 12px;
      "
    />

    <!-- 📝 설명 -->
    <div class="input-group">
      <label for="description">📝 설명</label>
      <textarea
        id="description"
        name="description"
        rows="3"
        placeholder="이 색상과 함께한 순간에 대해 이야기해주세요."
      ></textarea>
    </div>

    <!-- 업로드 버튼 -->
    <button
      type="submit"
      class="btn primary upload-btn"
      id="submit-btn"
      disabled
    >
      업로드하기
    </button>
  </section>
</form>

<script src="https://unpkg.com/fast-average-color@9.5.0/dist/index.browser.min.js"></script>
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>

{% endblock %}
